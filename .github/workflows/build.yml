name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile example for iOS 18
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # Diagnostic only. xcodebuild invents a workspace named after the folder
      # and its generated scheme names do not reliably match the product name,
      # which is why the build step below does not use it. Never fails the job.
      - name: Schemes xcodebuild can see
        run: xcodebuild -list || true

      # Compiles the package against the iOS SDK directly. No scheme, no
      # workspace, no Xcode project. This answers exactly one question: does the
      # SwiftUI in example/ and references/ compile for iOS 18.
      - name: Compile for iOS 18
        run: |
          set -o pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          swift build \
            -Xswiftc -sdk -Xswiftc "$SDK" \
            -Xswiftc -target -Xswiftc arm64-apple-ios18.0
