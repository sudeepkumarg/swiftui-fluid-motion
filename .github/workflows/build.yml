name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Compile example for iOS 18
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          xcodebuild -version
          swift --version
          xcrun --sdk iphoneos --show-sdk-path

      # Diagnostic only. xcodebuild invents a workspace named after the folder
      # and its generated scheme names do not reliably match the product name,
      # which is why the build step below does not use it. Never fails the job.
      - name: Schemes xcodebuild can see
        run: xcodebuild -list || true

      # Builds with xcodebuild against a generic iOS destination. Cross
      # compiling via `swift build -Xswiftc -sdk` does not work: SwiftPM injects
      # its own macOS sysroot afterwards and the target flag is ignored.
      - name: Compile for iOS 18
        run: |
          set -o pipefail
          xcodebuild build \
            -scheme FluidMotionExample \
            -destination 'generic/platform=iOS' \
            -quiet
